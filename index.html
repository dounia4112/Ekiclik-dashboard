<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EkiClik Sales Dashboard</title>
<meta name="description" content="Réplique HTML interactive d’un tableau de bord Power BI de suivi commercial et de financement — données entièrement fictives.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#E0E0E0; --navy:#003247; --navy-2:#022B3A; --lime:#98BD20; --olive:#7B9918; --olive-2:#739B2A;
  --ink:#003247; --muted:#58707D; --hair:#E4E9EC; --white:#fff; --good:#3F8F1F; --bad:#C8352E;
  --grad-nl:linear-gradient(90deg,#003247 0%,#003247 22%,#2C573F 50%,#6A962B 78%,#98BD20 100%);
  --grad-ln:linear-gradient(90deg,#98BD20 0%,#90B624 16%,#5E8A33 42%,#22493F 68%,#003247 86%,#003247 100%);
  --font:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#C7CDD1;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#frame{position:relative;flex:none;border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(0,25,38,.28);background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.page{position:absolute;inset:0;display:none}
.page.on{display:block}
.blk{position:absolute}
#mnav{display:none}

/* ---------- logo ---------- */
.logo{display:flex;align-items:flex-end;height:var(--lh);font-family:Poppins,var(--font);font-weight:800;line-height:.74;letter-spacing:-.02em;white-space:nowrap}
.logo .lm{height:calc(var(--lh)*.74);width:auto;margin-right:calc(var(--lh)*.04);flex:none}
.logo .lk{color:#fff;font-size:var(--lh)}
.logo .lc{color:var(--lime);font-size:var(--lh)}

/* ---------- sidebar ---------- */
.sb{background:var(--navy)}
.sb-top{border-radius:20px 20px 28px 0}
.sb-bot{border-radius:0 28px 20px 20px}
.sb-row{background:var(--navy)}
.sb-row::after{content:"";position:absolute;left:31px;top:0;right:0;bottom:0;background:var(--bg);border-radius:12px 0 0 12px}
.sb-logo{position:absolute;left:18px;top:16px}
.sb-foot{position:absolute;left:18px;right:16px;bottom:16px;color:rgba(255,255,255,.62);font-size:10px;line-height:1.5}
.sb-foot b{display:inline-block;color:var(--navy);background:var(--lime);border-radius:999px;padding:1px 8px;font-size:9.5px;letter-spacing:.04em;margin-bottom:6px}
.nav-btn{left:44px;width:185px;height:40px;background:none;border:0;color:#fff;font-weight:700;font-size:12px;text-align:left;padding:0 0 0 12px;cursor:pointer;border-radius:10px;z-index:3;transition:background .15s}
.nav-btn:hover{background:rgba(255,255,255,.09)}
.nav-btn:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
.nav-btn.on{color:var(--navy);cursor:default}
.nav-btn.on:hover{background:none}
.nav-btn.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--lime)}

/* ---------- header + slicers ---------- */
.hdr{border-radius:9px;z-index:30}
.hdr.g-nl{background:var(--grad-nl)}
.hdr.g-ln{background:var(--grad-ln)}
.hdr.light{background:var(--bg);border-radius:9px}
.hg{position:absolute;top:0;height:100%}
.hl{position:absolute;left:0;top:50%;transform:translateY(-50%);color:#fff;font-weight:800;font-size:13.5px;letter-spacing:.02em;white-space:nowrap}
.light .hl{background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 45%,var(--olive) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.slc{position:absolute;top:50%;transform:translateY(-50%);height:31px}
.slc-btn{width:100%;height:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 12px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.38);border-radius:7px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.slc-btn:hover{background:rgba(255,255,255,.22)}
.slc-btn:focus-visible{outline:2px solid #fff;outline-offset:1px}
.light .slc-btn{background:#fff;border-color:#C3CED4;color:var(--navy)}
.light .slc-btn:hover{background:#F4F7F8}
.slc-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slc-btn svg{flex:none;opacity:.85}
.slc-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:360px;background:#fff;border-radius:10px;box-shadow:0 14px 36px rgba(0,30,45,.28);padding:6px;z-index:100;color:var(--navy)}
.slc.rt .slc-menu{left:auto;right:0}
.slc-menu[hidden]{display:none}
.slc-search{width:100%;height:30px;border:1px solid #CBD5DA;border-radius:7px;padding:0 10px;font:inherit;font-size:12px;color:var(--navy);margin-bottom:5px;outline:none}
.slc-search:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(152,189,32,.2)}
.slc-list{max-height:290px;overflow:auto}
.slc-opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;font-size:12px;color:var(--navy);cursor:pointer;white-space:nowrap}
.slc-opt:hover,.slc-opt:focus-visible{background:#EEF3F5;outline:none}
.slc-opt.on{background:#EEF5DA;font-weight:700}
.slc-opt.ind{padding-left:26px;font-weight:500}
.slc-opt.grp{font-weight:800}
.slc-opt .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:none;border:1.5px solid #A9BAC3}
.slc-opt.on .dot{background:var(--lime);border-color:var(--lime)}
.slc-empty{padding:10px;font-size:12px;color:var(--muted)}

/* ---------- panels ---------- */
.panel{border-radius:14px;overflow:hidden}
.p-white{background:#fff}
.p-navy{background:var(--navy);color:#fff}
.p-lime{background:var(--lime)}
.p-gl{background:linear-gradient(90deg,#98BD20 0%,#8DB326 28%,#638E31 62%,#36633A 100%)}
.p-out-g{background:var(--bg);border:2px solid #4C7A35;border-radius:9px}
.p-out-n{background:#fff;border:2px solid var(--navy);border-radius:8px}
.p-out-l{background:#fff;border:2px solid var(--olive-2);border-radius:8px}
.p-clear{background:transparent;overflow:visible}
.ttl{font-weight:700;font-size:14.5px;line-height:1.2;text-align:center;padding:12px 14px 0;color:var(--navy)}
.ttl.l{text-align:left;padding-left:9px;padding-top:9px}
.ttl.w{color:#fff}
.ttl.lime{color:var(--lime)}
.ttl.ol{color:var(--olive-2)}
.ttl.sm{font-size:12px;padding-top:6px}
.chart{position:absolute;left:6px;right:6px;top:36px;bottom:6px}

/* ---------- KPI cards ---------- */
.kpi{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 10px 9px;border-radius:14px}
.k-t{font-size:11px;font-weight:700;line-height:1.25}
.k-b{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.k-v{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.05;white-space:nowrap}
.k-s{font-size:10.5px;color:var(--muted);margin-top:4px;white-space:nowrap}
.p-navy .k-s{color:rgba(255,255,255,.65)}
.kpi.sm .k-v{font-size:21px}
.kpi.sm .k-t{font-size:11px}
.up{color:var(--good)} .down{color:var(--bad)}
.p-navy .up{color:#B7DA4A} .p-navy .down{color:#FF8F86}

/* custom KPI (KPI visual + YoY) */
.kx{position:absolute;left:18px;right:18px;top:36px;bottom:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:5px}
.kx-v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kx-g{font-size:11px;color:var(--muted)}
.kx-g b{color:var(--navy)}
.kx-bar{width:100%;height:6px;border-radius:6px;background:#E7ECEF;overflow:hidden}
.kx-bar i{display:block;height:100%;border-radius:6px;background:var(--lime)}

/* ---------- tables ---------- */
.tbl{position:absolute;left:8px;right:8px;top:38px;bottom:8px;overflow:auto;border-radius:8px;scrollbar-width:thin}
.tbl table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;table-layout:fixed}
.tbl th{position:sticky;top:0;z-index:1;font-weight:700;text-align:left;padding:7px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.tbl th .si{opacity:.55;font-size:9px;margin-left:3px}
.tbl td{padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tbl .r{text-align:right}
.tbl .c{text-align:center}
.tbl tfoot td{position:sticky;bottom:0;font-weight:800}
.barc{position:relative}
.barc .bar{position:absolute;right:6px;top:5px;bottom:5px;width:calc((100% - 12px) * var(--w));border-radius:3px}
.barc .bv{position:relative}
.tnote{font-size:10px;padding:6px 8px;opacity:.7}
/* lime variant */
.t-lime th{background:var(--olive);color:var(--navy-2)}
.t-lime td{color:var(--navy);border-bottom:1px solid rgba(0,50,71,.12)}
.t-lime tr:hover td{background:rgba(255,255,255,.28)}
.t-lime .bar{background:rgba(0,50,71,.14)}
/* gradient-lime variant */
.t-gl th{background:rgba(0,50,71,.88);color:#fff}
.t-gl td{color:#fff;border-bottom:1px solid rgba(255,255,255,.16)}
.t-gl td:first-child{font-weight:700}
.t-gl tr:hover td{background:rgba(255,255,255,.1)}
.t-gl .bar{background:rgba(255,255,255,.2)}
/* dark variant */
.t-dark th{background:var(--lime);color:var(--navy);line-height:1.2;vertical-align:bottom}
.t-dark td{color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
.t-dark tr:hover td{background:rgba(255,255,255,.06)}
.t-dark tfoot td{background:#0B4159;color:var(--lime)}
.t-dark .bar{background:rgba(152,189,32,.25)}
/* white variant */
.t-white th{background:#EEF2F4;color:var(--navy)}
.t-white td{color:var(--navy);border-bottom:1px solid var(--hair)}
.t-white tr:hover td{background:#F6F9FA}
.t-white tr.hl td{background:#F1F7DF}
.t-white tfoot td{background:#F3F6F7}
.t-white .bar{background:rgba(152,189,32,.35)}

/* status pills */
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;line-height:1.5}
.s-0{background:#E6EDF1;color:#2C4C5B}
.s-1{background:#DCEAF3;color:#125C77}
.s-2{background:#FFF1C7;color:#7A5B00}
.s-3{background:#EAF3D3;color:#4C6B12}
.s-4{background:#98BD20;color:#022B3A}
.s-5{background:#003247;color:#fff}
.s-6{background:#FBE1E0;color:#A12620}
.s-7{background:#ECEEEF;color:#5D6B72}

/* ---------- page: Région ---------- */
.rc{display:grid;grid-template-columns:1.05fr 1.1fr 1.25fr;align-items:center;padding:0 18px;gap:12px}
.rc-name{font-size:13px;font-weight:800;color:var(--lime);letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.rc-name i{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.rc-share{margin-top:8px;height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.rc-share i{display:block;height:100%;background:var(--lime);border-radius:5px}
.rc-sub{font-size:10px;color:rgba(255,255,255,.6);margin-top:5px}
.rc-v{font-size:25px;font-weight:700;white-space:nowrap;text-align:center}
.rc-m{display:grid;grid-template-columns:auto auto;gap:3px 10px;font-size:10.5px;color:rgba(255,255,255,.65);justify-content:end}
.rc-m b{color:#fff;text-align:right;font-variant-numeric:tabular-nums}
.mlegend{position:absolute;left:4px;right:4px;bottom:4px;display:flex;flex-direction:column;gap:5px}
.mlegend div{display:grid;grid-template-columns:12px 1fr auto;gap:7px;align-items:center;font-size:10.5px;background:#fff;border-radius:8px;padding:6px 9px}
.mlegend i{width:10px;height:10px;border-radius:50%}
.mlegend b{font-variant-numeric:tabular-nums}

/* ---------- page: Banque ---------- */
.bq-head{background:var(--grad-nl);border-radius:14px}
.bq-ring{border-radius:50%;background:var(--bg)}
.bq-bump{border-radius:50%;background:var(--grad-nl);background-size:1013px 100%;background-position:-354.5px 0}
.bq-c1{border-radius:50%;background:var(--bg)}
.bq-c2{border-radius:50%;background:linear-gradient(90deg,#2B5A3D,#4E7F36);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14px}
.bq-c2 .cv{font-size:22px;font-weight:800;white-space:nowrap;line-height:1.1}
.bq-c2 .cl{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.82);margin:3px 0}
.bq-c2 hr{width:84%;border:0;border-top:2px solid rgba(255,255,255,.45);margin:4px 0}
.bq-pill{background:var(--bg);border-radius:14px;display:flex;align-items:center;padding:0 18px 0 30px}
.bq-pill .bp-l{font-size:17px;font-weight:800;color:var(--navy);width:104px;flex:none}
.bq-pill .bp-sep{width:3px;height:68px;background:var(--navy);border-radius:2px;flex:none;margin-right:16px}
.bq-pill .bp-v{font-size:24px;font-weight:800;color:var(--navy);white-space:nowrap}
.bq-pill .bp-s{font-size:10.5px;color:var(--muted);margin-top:2px}
.bq-mid .ttl{padding-top:136px}
.bq-mid .chart{top:164px}
.plist{position:absolute;left:8px;right:8px;top:38px;bottom:8px;overflow:auto;scrollbar-width:thin}
.plist h4{margin:12px 2px 6px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.plist .tbl{position:static}

/* ---------- page: Mensuel ---------- */
.mn-strip{background:var(--grad-nl);border-radius:11px;padding:3px 8px}
.ms-in{height:100%;background:#fff;border-radius:8px;display:flex;align-items:stretch}
.ms{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 6px;min-width:0}
.ms.w{flex:1.2}
.ms-l{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ms-v{font-size:21px;font-weight:800;margin-top:6px;white-space:nowrap}
.ms.g .ms-v{color:var(--olive-2)}
.ms-x{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap}
.ms-d{width:3px;border-radius:2px;margin:20px 0;flex:none}
.ms-d.n{background:var(--navy)} .ms-d.g{background:var(--olive-2)}
.mbox{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;border-radius:6px}
.mbox.n{background:var(--navy)} .mbox.g{background:var(--olive-2)}
.cnt{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:8px 6px 9px;border-radius:9px;color:#fff}
.cnt.n{background:var(--navy)} .cnt.g{background:var(--olive-2)}
.cnt .cv{font-size:27px;font-weight:800;margin-bottom:auto;margin-top:auto;font-variant-numeric:normal}
.cnt .cl{font-size:10.5px;font-weight:700;line-height:1.3}

/* ---------- page: Dossier ---------- */
.dos-sum{border:2px solid var(--navy);border-radius:11px;overflow:hidden;display:grid;grid-template-columns:205px 202px 205px 204px 1fr;grid-template-rows:62px 1fr;background:var(--bg)}
.dos-sum .h{background:var(--grad-ln);background-size:1018px 100%;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;padding:0 8px;line-height:1.3}
.dos-sum .h:nth-child(2){background-position:-205px 0}.dos-sum .h:nth-child(3){background-position:-407px 0}.dos-sum .h:nth-child(4){background-position:-612px 0}.dos-sum .h:nth-child(5){background-position:-816px 0}
.dos-sum .v{display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--navy);border-left:2px solid var(--navy);white-space:nowrap}
.dos-sum .v:first-of-type{font-size:15px;font-weight:500}
.dos-sum .h+.h{border-left:2px solid var(--navy)}
.dos-sum .v.t{border-left:0;font-size:15px;font-weight:500}
.dos-steps{border:2px solid #6A9A2D;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 10px 0 12px;background:var(--bg)}
.ds-l{font-weight:800;font-size:13px;background:linear-gradient(90deg,var(--navy),var(--olive));-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.chips{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1}
.chip{flex:none;display:flex;align-items:center;gap:5px;border:1.5px solid #B7C5CC;background:#fff;color:var(--navy);border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s}
.chip small{font-weight:600;opacity:.65;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--olive)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on small{opacity:.8}
.chip.all.on{background:var(--olive);border-color:var(--olive)}
.dos-tbl{border:2px solid var(--navy);border-radius:12px;overflow:hidden;background:var(--bg)}
.dos-tbl .dt-head{position:absolute;left:0;right:0;top:0;height:39px;background:var(--grad-ln)}
.t-dos{left:0;right:0;top:0;bottom:0;border-radius:0}
.t-dos table{font-size:10.5px}
.t-dos th,.t-dos td{padding-left:6px;padding-right:6px}
.t-dos th{background:transparent;color:#fff;height:39px;font-size:11px}
.t-dos thead th{position:sticky;top:0;background:var(--grad-ln);background-size:1014px 100%}
.t-dos td{color:var(--navy);border-bottom:1px solid rgba(0,50,71,.1)}
.t-dos tr:hover td{background:rgba(255,255,255,.55)}
.t-dos .tnote{position:sticky;bottom:0;background:var(--bg);opacity:1;color:var(--muted);border-top:1px solid rgba(0,50,71,.12)}

/* ---------- page: Commerciaux ---------- */
.p-r18{border-radius:18px}
.rk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:10.5px;font-weight:800;background:#EEF2F4;color:var(--navy)}
.rk.r1{background:var(--lime);color:var(--navy)} .rk.r2{background:#C9DD86} .rk.r3{background:#E1EDBB}
.an{display:flex;flex-direction:column;line-height:1.25;overflow:hidden}
.an b{font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.an span{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.an i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* ---------- page: Accueil ---------- */
#p-accueil{background:var(--navy)}
.home-menu{display:flex;flex-direction:column;gap:12px}
.home-btn{position:relative;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;font-size:16px;font-weight:700;text-align:left;cursor:pointer;transition:all .18s}
.home-btn::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--lime);opacity:0;transition:opacity .18s}
.home-btn span.n{font-size:11px;color:var(--lime);font-weight:800;margin-right:12px;font-variant-numeric:tabular-nums}
.home-btn svg{opacity:.5;transition:transform .18s,opacity .18s}
.home-btn:hover,.home-btn:focus-visible{background:rgba(152,189,32,.14);border-color:rgba(152,189,32,.5);outline:none}
.home-btn:hover::before,.home-btn:focus-visible::before{opacity:1}
.home-btn:hover svg{opacity:1;transform:translateX(3px)}
.home-tag{color:rgba(255,255,255,.62);font-size:13px;font-weight:600;letter-spacing:.02em}

/* ---------- mobile (stacked) ---------- */
body.mobile{background:var(--bg)}
body.mobile #app{position:static;display:block;overflow:visible}
body.mobile #frame{width:auto!important;height:auto!important;box-shadow:none;border-radius:0;overflow:visible}

body.mobile .hl{position:static;transform:none;font-size:11px}
body.mobile .slc{position:relative;left:auto!important;width:100%!important;transform:none;top:auto}
body.mobile .slc-menu{max-width:calc(100vw - 52px)}
body.mobile .slc.rt .slc-menu{left:auto;right:0}
body.mobile .mn-strip .ms-in{flex-wrap:wrap;padding:6px 0}

body.mobile .dos-sum{grid-template-columns:1fr 1fr;grid-template-rows:auto}

body.mobile .dos-steps{flex-wrap:wrap;padding:10px}

<script>
'use strict';
/* =====================================================================

   ===================================================================== */
const BRAND = { a:'ki', b:'Clik', name:'EkiClik' };   // change here to rebrand
const FONT = "'Public Sans','Segoe UI',system-ui,sans-serif";
const C = { navy:'#003247', navy2:'#022B3A', lime:'#98BD20', lime3:'#A6CE39', olive:'#7B9918', olive2:'#739B2A',
  teal:'#125C77', yellow:'#F8C603', dgreen:'#005041', muted:'#58707D', hair:'#E4E9EC', bad:'#C8352E', good:'#3F8F1F' };
const REG = ['CENTRE','EST','OUEST'];
const REGC = { CENTRE:C.navy2, EST:C.lime3, OUEST:C.olive };
const BANKS = ['Al Salam','CPA'];
const BANKC = { 'Al Salam':C.dgreen, 'CPA':C.yellow };
const CATS = ['ÉLECTROMÉNAGER','TÉLÉPHONIE','MULTIMÉDIA','MEUBLES'];
const CATC = { 'ÉLECTROMÉNAGER':C.navy, 'TÉLÉPHONIE':C.lime, 'MULTIMÉDIA':C.teal, 'MEUBLES':C.yellow };
const SERIES5 = [C.navy, C.lime, C.teal, C.olive, C.yellow];
const TYPES = { SWRF:'Showroom '+BRAND.name, SWPT:'Showroom partenaire', PDVA:'Point de vente agréé' };
const TYPEC = { SWRF:C.navy, SWPT:C.lime, PDVA:C.teal };
const STATUSES = ['Créée','En étude','Documents manquants','Validée','Financée','Livrée','Refusée','Annulée'];
const SGROUP = { 'Créée':'P','En étude':'P','Documents manquants':'P','Validée':'P','Financée':'F','Livrée':'F','Refusée':'R','Annulée':'A' };
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const YEARS = [2024, 2025, 2026];
const CUR_Y = 2026, LAST_M = 8;                       // données jusqu’au 30 septembre 2026
const START = new Date(2024,0,1).getTime(), END = new Date(2026,8,30).getTime();
const TVA = 1.19;
const COMM_RATE = { 'Al Salam':0.035, 'CPA':0.03 };

/* =====================================================================
   Formatting (fr-FR)
   ===================================================================== */
const NF = {}; const nf = d => NF[d] || (NF[d] = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}));
function money(v){ if(v==null||!isFinite(v)) return '–'; const a=Math.abs(v);
  if(a>=1e9) return nf(2).format(v/1e9)+' Md DA'; if(a>=1e6) return nf(a>=1e8?1:2).format(v/1e6)+' M DA';
  if(a>=1e3) return nf(1).format(v/1e3)+' k DA'; return nf(0).format(v)+' DA'; }
function short(v){ if(v==null||!isFinite(v)) return ''; const a=Math.abs(v);
  if(a>=1e9) return nf(1).format(v/1e9)+' Md'; if(a>=1e6) return nf(a>=1e7?0:1).format(v/1e6)+' M'; if(a>=1e3) return nf(0).format(v/1e3)+' k'; return nf(0).format(v); }
const int = v => nf(0).format(v||0);
const pct = (v,d=1) => (v==null||!isFinite(v)) ? '–' : nf(d).format(v*100)+' %';
const spct = (v,d=1) => (v==null||!isFinite(v)) ? '–' : (v>=0?'+':'−')+nf(d).format(Math.abs(v)*100)+' %';
const arrow = v => v>=0 ? '▲' : '▼';
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate = t => { const d=new Date(t); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
function period(y,m0,m1){ if(m0==null||(m0===0&&m1===11)) return String(y); if(m0===m1) return MONTHS[m0]+' '+y; return MS[m0]+'–'+MS[m1]+' '+y; }

/* =====================================================================
   Fake data generator (seeded → identical on every load)
   ===================================================================== */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry32(20261016);
const R = (a,b) => a+(b-a)*rnd();
const RI = (a,b) => Math.floor(R(a,b+1));
const pick = a => a[Math.floor(rnd()*a.length)];
function gauss(){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function poisson(l){ if(l<=0) return 0; if(l>25) return Math.max(0,Math.round(l+Math.sqrt(l)*gauss())); const L=Math.exp(-l); let k=0,p=1; do{k++;p*=rnd();}while(p>L); return k-1; }
const dmy = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).getTime(); };

const WIL = [
 ['Alger','CENTRE',36.75,3.06],['Blida','CENTRE',36.47,2.83],['Tizi Ouzou','CENTRE',36.71,4.05],['Bouira','CENTRE',36.37,3.90],
 ['Médéa','CENTRE',36.26,2.75],['Chlef','CENTRE',36.17,1.33],['Djelfa','CENTRE',34.67,3.26],["M’Sila",'CENTRE',35.70,4.54],['Ghardaïa','CENTRE',32.49,3.67],
 ['Constantine','EST',36.37,6.61],['Sétif','EST',36.19,5.41],['Batna','EST',35.56,6.17],['Béjaïa','EST',36.75,5.08],['Annaba','EST',36.90,7.77],
 ['Skikda','EST',36.88,6.90],['Mila','EST',36.45,6.26],['Jijel','EST',36.82,5.77],['Biskra','EST',34.85,5.73],['Bordj Bou Arréridj','EST',36.07,4.76],
 ['Tébessa','EST',35.40,8.12],['Ouargla','EST',31.95,5.33],
 ['Oran','OUEST',35.70,-0.63],['Tlemcen','OUEST',34.88,-1.32],['Mostaganem','OUEST',35.93,0.09],['Sidi Bel Abbès','OUEST',35.19,-0.63],
 ['Mascara','OUEST',35.40,0.14],['Relizane','OUEST',35.74,0.56],['Tiaret','OUEST',35.37,1.32],['Béchar','OUEST',31.62,-2.22],['Adrar','OUEST',27.87,-0.29]
].map(([name,reg,lat,lon])=>({name,reg,lat,lon}));
const WMAP = Object.fromEntries(WIL.map(w=>[w.name,w]));

// [type, enseigne, wilaya, taille, banque, ouverture, fermeture] — enseignes fictives
const POS_DEF = [
 ['SWRF',BRAND.name,'Alger',4.2,'Al Salam'],['SWRF',BRAND.name,'Oran',3.6,'CPA'],['SWRF',BRAND.name,'Sétif',3.1,'Al Salam'],
 ['SWRF',BRAND.name,'Constantine',3.3,'CPA'],['SWRF',BRAND.name,'Mostaganem',2.2,'Al Salam','2025-03-01'],
 ['SWPT','Electro Nour','Alger',2.4,'CPA'],['SWPT','Dar El Djazair','Alger',1.9,'Al Salam'],['SWPT','Maison Atlas','Blida',1.8,'Al Salam'],
 ['SWPT','Kabylie Équipement','Tizi Ouzou',1.6,'CPA'],['SWPT','Hodna Équipement',"M’Sila",1.2,'Al Salam'],['SWPT','Cirta Home','Constantine',1.7,'Al Salam'],
 ['SWPT','Numidia Store','Annaba',1.6,'CPA'],['SWPT','Zitouna Phone','Sétif',1.5,'CPA'],['SWPT','Médina Électro','Béjaïa',1.4,'Al Salam'],
 ['SWPT','Tassili Meubles','Batna',1.3,'CPA','2024-06-01'],['SWPT','Sahel Électro','Oran',1.9,'Al Salam'],['SWPT','Rym Confort','Tlemcen',1.5,'CPA'],
 ['PDVA','Ets Benali','Batna',1.0,'Al Salam'],['PDVA','Ets Hamidi','Chlef',0.9,'CPA'],['PDVA','Ets Bouzid','Tiaret',0.8,'Al Salam'],
 ['PDVA','Ets Mansouri','Skikda',0.9,'CPA'],['PDVA','Ets Kaci','Bouira',0.8,'Al Salam'],['PDVA','Ets Ferhat','Biskra',0.9,'CPA','2024-09-01'],
 ['PDVA','Ets Saïdi','Mascara',0.7,'Al Salam'],['PDVA','Ets Rahmani','Sidi Bel Abbès',0.9,'CPA'],['PDVA','Ets Larbi','Djelfa',0.7,'Al Salam'],
 ['PDVA','Ets Belkacem','Béchar',0.6,'CPA'],['PDVA','Ets Touati','Ouargla',0.6,'Al Salam','2025-01-15'],['PDVA','Ets Amrani','Relizane',0.7,'CPA',null,'2025-07-31'],
 ['PDVA','Ets Brahimi','Bordj Bou Arréridj',0.9,'Al Salam'],['PDVA','Ets Chérif','Mila',0.6,'CPA'],['PDVA','Ets Djebbar','Ghardaïa',0.6,'Al Salam','2025-05-01'],
 ['PDVA','Ets Ouali','Médéa',0.7,'CPA',null,'2026-02-28'],['PDVA','Ets Meziane','Jijel',0.6,'Al Salam','2026-01-10'],
 ['PDVA','Ets Hadj','Adrar',0.5,'CPA','2025-10-01'],['PDVA','Ets Guendouz','Tébessa',0.6,'Al Salam']
];
const RESP = ['Mourad Benyahia','Samia Lounis','Farid Guerroudj','Leila Mebarki'];
const AGENTS_DEF = [
 ['Amine Khelifi','CENTRE',0],['Sara Boudiaf','CENTRE',0],['Yacine Merabet','CENTRE',3],['Nadia Haddad','CENTRE',3],['Karim Belaïd','CENTRE',1],
 ['Lina Messaoudi','EST',1],['Riad Zerrouki','EST',1],['Imane Saâdi','EST',3],['Walid Bensalem','EST',2],['Meriem Taleb','EST',0],
 ['Sofiane Rahal','OUEST',2],['Asma Kerroum','OUEST',1],['Hichem Abdi','OUEST',0],['Nour El Houda Ziani','OUEST',2]
];
const CATALOG = [
 {c1:'ÉLECTROMÉNAGER',c3:'Réfrigérateurs',w:14,b:['Condor','Samsung','LG','Brandt','Iris'],p:[62000,185000],it:['Réfrigérateur No Frost 450 L','Réfrigérateur combiné 380 L','Réfrigérateur Side by Side 600 L'],cr:[.76,.85]},
 {c1:'ÉLECTROMÉNAGER',c3:'Machines à laver',w:11,b:['Condor','Samsung','LG','Brandt','Beko'],p:[52000,135000],it:['Lave-linge frontal 8 kg','Lave-linge frontal 10 kg','Lave-linge séchant 9 kg'],cr:[.76,.85]},
 {c1:'ÉLECTROMÉNAGER',c3:'Climatiseurs',w:9,b:['Condor','Gree','LG','Samsung','Midea'],p:[58000,155000],it:['Climatiseur Inverter 12 000 BTU','Climatiseur Inverter 18 000 BTU','Climatiseur 24 000 BTU'],cr:[.74,.84]},
 {c1:'ÉLECTROMÉNAGER',c3:'Cuisinières',w:7,b:['Condor','Brandt','Iris','Géant'],p:[34000,92000],it:['Cuisinière 4 feux 60 cm','Cuisinière 5 feux 90 cm','Cuisinière mixte inox'],cr:[.75,.85]},
 {c1:'ÉLECTROMÉNAGER',c3:'Lave-vaisselle',w:4,b:['Brandt','Samsung','Beko','Condor'],p:[68000,128000],it:['Lave-vaisselle 12 couverts','Lave-vaisselle 14 couverts'],cr:[.76,.85]},
 {c1:'TÉLÉPHONIE',c3:'Smartphones',w:22,b:['Samsung','Xiaomi','Apple','Oppo','Realme'],p:[24000,235000],it:['Smartphone 128 Go','Smartphone 256 Go','Smartphone 5G 256 Go','Smartphone Pro 512 Go'],cr:[.82,.9]},
 {c1:'TÉLÉPHONIE',c3:'Tablettes',w:5,b:['Samsung','Lenovo','Apple','Xiaomi'],p:[29000,115000],it:['Tablette 10" 64 Go','Tablette 11" 128 Go'],cr:[.8,.89]},
 {c1:'MULTIMÉDIA',c3:'Téléviseurs',w:12,b:['Samsung','LG','Condor','Iris','TCL'],p:[42000,260000],it:['TV LED 43" Smart','TV UHD 55" Smart','TV QLED 65"'],cr:[.77,.86]},
 {c1:'MULTIMÉDIA',c3:'PC portables',w:6,b:['HP','Lenovo','Dell','Asus'],p:[68000,245000],it:['PC portable 15" Core i5','PC portable 14" Core i7','PC portable gamer 16"'],cr:[.79,.88]},
 {c1:'MEUBLES',c3:'Salons',w:5,b:['Atlas Déco','Confort Plus','Bois d’Orient'],p:[115000,360000],it:['Salon d’angle 7 places','Salon moderne 5 places'],cr:[.64,.76]},
 {c1:'MEUBLES',c3:'Chambres à coucher',w:4,b:['Atlas Déco','Confort Plus','Bois d’Orient'],p:[140000,420000],it:['Chambre à coucher complète','Chambre adulte 160 cm'],cr:[.64,.76]},
 {c1:'MEUBLES',c3:'Salles à manger',w:3,b:['Confort Plus','Bois d’Orient'],p:[85000,240000],it:['Salle à manger 6 chaises','Table + buffet'],cr:[.65,.77]}
];
const SEASON = [0.88,0.9,1.12,1.05,0.97,1.08,1.16,1.12,1.06,0.96,0.92,1.02];
const RAMADAN = { 2024:[2], 2025:[2], 2026:[1,2] };
function catFactor(c3, y, m){
  const ram = RAMADAN[y].includes(m);
  switch(c3){
    case 'Climatiseurs': return [0.25,0.25,0.4,0.7,1.4,2.6,2.9,2.4,1.2,0.5,0.3,0.25][m];
    case 'Téléviseurs': return (ram?1.6:1) * (m>=10?1.2:1);
    case 'PC portables': return m===8?1.8 : m===9?1.4 : 1;
    case 'Réfrigérateurs': return (ram?1.3:1) * (m>=4&&m<=7?1.3:1);
    case 'Smartphones': return (ram?1.2:1) * (m===8?1.2:1);
    case 'Salons': case 'Chambres à coucher': case 'Salles à manger': return m>=5&&m<=7?1.5:1;
    default: return 1;
  }
}

const POS = POS_DEF.map((d,i)=>{
  const [type,partner,wil,size,bank,open,close]=d, w=WMAP[wil], code=String(i+1).padStart(3,'0');
  return { i, code, type, partner, wil, reg:w.reg, size, bank, open:open?dmy(open):0, close:close?dmy(close):Infinity,
    name:`${code}-${type} - ${partner} - ${wil}`, short: type==='SWRF' ? `Showroom ${wil}` : `${partner} · ${wil}`,
    status: close ? 'INACTIF' : 'ACTIF', lat:w.lat+(rnd()-.5)*0.18, lon:w.lon+(rnd()-.5)*0.24, agents:[], trend:R(0.9,1.12) };
});
const SW = POS.filter(p=>p.type==='SWRF');
const AG = AGENTS_DEF.map(([name,reg,resp],i)=>({ i, name, reg, resp, skill:R(0.88,1.12) }));
(function assignAgents(){
  const cnt = {CENTRE:0,EST:0,OUEST:0};
  POS.forEach(p=>{ const c = AG.filter(a=>a.reg===p.reg); const a1 = c[cnt[p.reg]++ % c.length]; p.agents=[a1.i];
    if(p.size>1.3 || rnd()<0.3){ const a2 = c[(cnt[p.reg]+1) % c.length]; if(a2.i!==a1.i) p.agents.push(a2.i); } });
})();

const RECS = []; const EXP = new Float64Array(POS.length*36);
(function generate(){
  const BASE = 0.6, dayMs = 864e5; let seq = 0; const wcache = {};
  const catW = (y,m) => wcache[y*12+m] || (wcache[y*12+m] = (()=>{ const w=CATALOG.map(c=>c.w*catFactor(c.c3,y,m)); const s=w.reduce((a,b)=>a+b,0); return {w,s}; })());
  for(let t=START; t<=new Date(2026,11,31).getTime(); t+=dayMs){
    const d=new Date(t), y=d.getFullYear(), m=d.getMonth(), wd=d.getDay();
    const wf = wd===5?0.35 : wd===6?0.85 : 1.05;
    const sf = SEASON[m] * (RAMADAN[y].includes(m)?1.18:1);
    const yrs = (t-START)/(365*dayMs), gf = 1 + 0.27*yrs + 0.03*Math.sin(yrs*6.28);
    for(const p of POS){
      if(t<p.open || t>p.close) continue;
      const ramp = Math.min(1, 0.45 + (t-p.open)/(120*dayMs)*0.55);       // nouveaux POS : montée en charge
      const lam = p.size*BASE*wf*sf*gf*p.trend*(p.open?ramp:1);
      EXP[p.i*36+(y-2024)*12+m] += lam;
      if(t>END) continue;
      const n = poisson(lam);
      for(let k=0;k<n;k++){
        const cw = catW(y,m); let r = rnd()*cw.s, ci = 0; while((r-=cw.w[ci])>0 && ci<CATALOG.length-1) ci++;
        const c = CATALOG[ci], brand = pick(c.b), qty = (c.c1==='TÉLÉPHONIE' && rnd()<0.08) ? 2 : 1;
        const price = Math.round((c.p[0]+(c.p[1]-c.p[0])*Math.pow(rnd(),1.7))/100)*100*qty;
        const cost = Math.round(price*R(c.cr[0],c.cr[1])/100)*100;
        const ag = AG[p.agents.length>1 && rnd()<0.35 ? p.agents[1] : p.agents[0]];
        const age = (END-t)/dayMs; const st = status(age, p, ag);
        seq++;
        RECS.push({ id:`${String(y).slice(2)}${String(m+1).padStart(2,'0')}-${String(seq).padStart(5,'0')}`, t, y, m, day:d.getDate(),
          pos:p.i, bank:p.bank, c1:c.c1, c3:c.c3, brand, prod:pick(c.it),
          ref:brand.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()+'-'+RI(1000,9999)+pick(['A','B','C','S','X']),
          qty, price, cost, comm:Math.round(price*COMM_RATE[p.bank]), st, g:SGROUP[st], ag:ag.i });
      }
    }
  }
  function status(age, p, ag){
    const pp = age<7?0.45 : age<20?0.16 : age<45?0.05 : age<90?0.015 : 0.004;
    if(rnd()<pp){ const r=rnd(); return age<4 ? (r<.55?'Créée':r<.85?'En étude':'Documents manquants') : (r<.18?'Créée':r<.5?'En étude':r<.75?'Documents manquants':'Validée'); }
    const pr = ((p.bank==='CPA'?0.23:0.18) + (p.type==='PDVA'?0.04:p.type==='SWRF'?-0.03:0)) / ag.skill;
    const r = rnd(); if(r<pr) return 'Refusée'; if(r<pr+0.065) return 'Annulée';
    return age>18 && rnd()<0.9 ? 'Livrée' : 'Financée';
  }
})();
const OBJ = new Float64Array(POS.length*36);
(function objectives(){
  let sF=0,nF=0,nRes=0; for(const r of RECS){ if(r.g==='F'){sF+=r.price;nF++;} if(r.g!=='P') nRes++; }
  const avgT=sF/nF, fin=nF/nRes;
  POS.forEach(p=>YEARS.forEach((y,yi)=>{ const tf=R(0.9,1.1); for(let m=0;m<12;m++){ const k=p.i*36+yi*12+m; OBJ[k]=Math.round(EXP[k]*avgT*fin*tf/1000)*1000; } }));
})();

/* =====================================================================
   Measures
   ===================================================================== */
const isAll = v => v==null || v==='all';
function dateF(v){ if(isAll(v)) return {}; if(v[0]==='Y') return {y:+v.slice(1)}; const [y,m]=v.slice(1).split('-').map(Number); return {y,m0:m,m1:m}; }
function pred(f){
  const P=isAll(f.pos)?-1:+f.pos, A=isAll(f.ag)?-1:+f.ag, bank=isAll(f.bank)?null:f.bank, c1=isAll(f.c1)?null:f.c1;
  const y=f.y??null, m0=f.m0??0, m1=f.m1??11, reg=f.reg||null, sw=!!f.sw, st=f.st&&f.st.size?f.st:null;
  return r => (P<0||r.pos===P) && (A<0||r.ag===A) && (!bank||r.bank===bank) && (!c1||r.c1===c1) && (y===null||r.y===y)
    && r.m>=m0 && r.m<=m1 && (!reg||POS[r.pos].reg===reg) && (!sw||POS[r.pos].type==='SWRF') && (!st||st.has(r.st));
}
const sel = f => RECS.filter(pred(f));
const newAgg = () => ({n:0,nF:0,nR:0,nP:0,nA:0,ca:0,cogs:0,comm:0,caP:0,amt:0,amtCost:0,amtComm:0});
function add(a,r){ a.n++; a.amt+=r.price; a.amtCost+=r.cost; a.amtComm+=r.comm;
  if(r.g==='F'){ a.nF++; a.ca+=r.price; a.cogs+=r.cost; a.comm+=r.comm; } else if(r.g==='R') a.nR++; else if(r.g==='P'){ a.nP++; a.caP+=r.price; } else a.nA++; }
function agg(rs){ const a=newAgg(); for(const r of rs) add(a,r); return a; }
function group(rs,key){ const m=new Map(); for(const r of rs){ const k=key(r); let a=m.get(k); if(!a){ a=newAgg(); m.set(k,a); } add(a,r); } return m; }
function objSum(f, toDate=true){
  const P=isAll(f.pos)?-1:+f.pos, A=isAll(f.ag)?-1:+f.ag, bank=isAll(f.bank)?null:f.bank;
  const ys=f.y!=null?[f.y]:YEARS, m0=f.m0??0, m1=f.m1??11; let s=0;
  for(const p of POS){
    if(P>=0&&p.i!==P) continue; if(bank&&p.bank!==bank) continue; if(f.reg&&p.reg!==f.reg) continue;
    if(f.sw&&p.type!=='SWRF') continue; if(A>=0&&!p.agents.includes(A)) continue;
    for(const y of ys) for(let m=m0;m<=m1;m++){ if(toDate && y===CUR_Y && m>LAST_M) continue; s+=OBJ[p.i*36+(y-2024)*12+m]; }
  }
  return s;
}
function monthly(rs, y, field='ca'){ const out=Array(12).fill(0); for(const r of rs) if(r.y===y && r.g==='F') out[r.m]+= field==='ca'?r.price:r[field]; return out.map((v,m)=> y===CUR_Y&&m>LAST_M ? null : v); }
function objMonthly(f, y){ return Array.from({length:12},(_,m)=> objSum({...f, y, m0:m, m1:m}, false)); }
function projection(y, f){ const ca = agg(sel({...f, y})).ca; return y<CUR_Y ? ca : ca/(LAST_M+1)*12; }
const lastM = y => y===CUR_Y ? LAST_M : 11;
function topN(map, n){ return [...map.entries()].sort((a,b)=>b[1].ca-a[1].ca).slice(0,n); }

function table(id, cols, rows, opt={}){ const el=$(id); el._cols=cols; el._rows=rows; el._opt=opt; if(!el._sort&&opt.sort) el._sort=opt.sort; drawTable(el); }
function drawTable(el){
  const cols=el._cols, opt=el._opt; let rows=el._rows;
  if(el._sort){ const {k,dir}=el._sort; const c=cols.find(c=>c.k===k); if(c){ const sv=c.sv||(r=>r[k]); rows=[...rows].sort((a,b)=>{ const va=sv(a),vb=sv(b); return (typeof va==='string'?va.localeCompare(vb,'fr'):va-vb)*dir; }); } }
  const shown = rows.slice(0, opt.cap||Infinity), max={};
  cols.filter(c=>c.bar).forEach(c=>{ let mx=1; for(const r of rows) if(r[c.k]>mx) mx=r[c.k]; max[c.k]=mx; });
  let h='<table><colgroup>'+cols.map(c=>`<col style="width:${c.w||'auto'}">`).join('')+'</colgroup><thead><tr>';
  h+=cols.map(c=>{ const s=el._sort&&el._sort.k===c.k ? (el._sort.dir>0?'▲':'▼') : ''; return `<th class="${c.al||''}" data-k="${c.k}" scope="col" title="Trier par ${esc(c.l.replace(/<[^>]+>/g,' '))}">${c.l}<span class="si">${s}</span></th>`; }).join('')+'</tr></thead><tbody>';
  for(const r of shown){
    h+=`<tr${opt.hl&&opt.hl(r)?' class="hl"':''}>`;
    for(const c of cols){ const v=r[c.k], txt=c.f?c.f(v,r):esc(v);
      if(c.bar) h+=`<td class="r barc"><span class="bar" style="--w:${(Math.max(0,v)/max[c.k]).toFixed(3)}"></span><span class="bv">${txt}</span></td>`;
      else h+=`<td class="${c.al||''}"${c.html?'':` title="${esc(String(txt).replace(/<[^>]+>/g,''))}"`}>${txt}</td>`; }
    h+='</tr>';
  }
  if(!shown.length) h+=`<tr><td colspan="${cols.length}" class="c" style="padding:18px;opacity:.7">Aucune donnée pour cette sélection</td></tr>`;
  h+='</tbody>'; if(opt.total) h+='<tfoot><tr>'+cols.map(c=>`<td class="${c.al||''}">${opt.total[c.k]??''}</td>`).join('')+'</tr></tfoot>';
  h+='</table>'; if(opt.note) h+=`<div class="tnote">${opt.note(rows.length,shown.length)}</div>`;
  el.innerHTML=h;
}

  if(document.body.classList.contains('mobile')) window.scrollTo(0,0);

  const mob = innerWidth<900;
  document.body.classList.toggle('mobile',mob);
  if(!mob){ const s=Math.min((innerWidth-32)/1280,(innerHeight-32)/720); stage.style.transform=`scale(${s})`; frame.style.width=1280*s+'px'; frame.style.height=720*s+'px'; }
  else { stage.style.transform=''; frame.style.width=''; frame.style.height=''; }
  if(mob!==lastMob || mob){ lastMob=mob; clearTimeout(rt); rt=setTimeout(()=>Object.values(CH).forEach(c=>{ if(c.getDom().offsetParent) c.resize(); }),60); }
}
window.addEventListener('resize',fit);
fit();
show(location.hash.slice(1)||'accueil');
if(document.fonts) document.fonts.ready.then(()=>Object.values(CH).forEach(c=>c.getDom().offsetParent&&c.resize()));
</script>
